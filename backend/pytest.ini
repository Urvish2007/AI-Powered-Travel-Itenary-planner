[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning:motor.*
    ignore::DeprecationWarning:pymongo.*
    ignore:.*model_fields.*:DeprecationWarning
    ignore:.*has no __module__ attribute.*:DeprecationWarning
