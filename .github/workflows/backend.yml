name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check app tests scripts

      - name: Ruff (format)
        run: ruff format --check app tests scripts

      - name: mypy
        run: mypy app
        # The codebase is progressively typed; failures are reported, not fatal.
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      # The stub provider keeps CI deterministic and free of network calls.
      LLM_PROVIDER: stub
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: test
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: local
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB_NAME: itinerary_planner_ci
      LLM_PROVIDER: stub
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Seed the database
        run: python -m scripts.seed_db --reset

      # Same script the deploy pipeline and docker-compose use. CI's mongo is a
      # standalone mongod, which cannot run transactions.
      - name: Apply migrations
        run: sh scripts/migrate.sh
        env:
          MIGRATE_USE_TRANSACTION: "false"

      - name: Start the API
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "API failed to start"; exit 1

      - name: Verify every endpoint
        run: python -m scripts.verify_endpoints --base-url http://127.0.0.1:8000

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Reported, not blocking: a new advisory should not stop an unrelated PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt -r requirements-ai.txt

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
